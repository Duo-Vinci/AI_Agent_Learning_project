# Kubernetes Secrets 配置
# 用于在 Kubernetes 集群中管理敏感信息

---
# API Keys Secret
apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-api-keys
  namespace: default
  labels:
    app: ai-agent
    component: secrets
type: Opaque
stringData:
  # AI 服务 API Keys
  OPENAI_API_KEY: "sk-your-openai-key-here"
  ANTHROPIC_API_KEY: "sk-ant-your-anthropic-key-here"
  DEEPSEEK_API_KEY: "sk-your-deepseek-key-here"

---
# Database Credentials Secret
apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-database
  namespace: default
  labels:
    app: ai-agent
    component: database
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:password@postgres-service:5432/agentdb"
  DB_USERNAME: "postgres"
  DB_PASSWORD: "your-secure-password"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "agentdb"

---
# Redis Credentials Secret
apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-redis
  namespace: default
  labels:
    app: ai-agent
    component: cache
type: Opaque
stringData:
  REDIS_URL: "redis://:redis-password@redis-service:6379/0"
  REDIS_PASSWORD: "your-redis-password"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

---
# Application Secret Key
apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-app-secrets
  namespace: default
  labels:
    app: ai-agent
    component: application
type: Opaque
stringData:
  SECRET_KEY: "your-secret-key-change-in-production"
  JWT_SECRET: "your-jwt-secret-key"
  ENCRYPTION_KEY: "your-encryption-key"

---
# 云服务凭证 - AWS
apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-aws-credentials
  namespace: default
  labels:
    app: ai-agent
    component: cloud
    provider: aws
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "your-aws-access-key"
  AWS_SECRET_ACCESS_KEY: "your-aws-secret-key"
  AWS_REGION: "us-east-1"

---
# 云服务凭证 - GCP (使用 service account JSON)
apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-gcp-credentials
  namespace: default
  labels:
    app: ai-agent
    component: cloud
    provider: gcp
type: Opaque
data:
  # Base64 编码的 service account JSON
  service-account.json: |
    <base64-encoded-service-account-json>

---
# 监控服务凭证
apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-monitoring
  namespace: default
  labels:
    app: ai-agent
    component: monitoring
type: Opaque
stringData:
  SENTRY_DSN: "https://your-sentry-dsn@sentry.io/project-id"
  DATADOG_API_KEY: "your-datadog-api-key"

---
# TLS 证书 Secret
apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-tls
  namespace: default
  labels:
    app: ai-agent
    component: tls
type: kubernetes.io/tls
data:
  # Base64 编码的证书和密钥
  tls.crt: |
    <base64-encoded-certificate>
  tls.key: |
    <base64-encoded-private-key>

---
# 使用示例：在 Deployment 中引用 Secrets
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-deployment
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
    spec:
      containers:
      - name: agent-api
        image: your-registry/ai-agent:latest
        ports:
        - containerPort: 8000

        # 方式 1: 从 Secret 加载所有键为环境变量
        envFrom:
        - secretRef:
            name: ai-agent-api-keys
        - secretRef:
            name: ai-agent-database
        - secretRef:
            name: ai-agent-redis
        - secretRef:
            name: ai-agent-app-secrets

        # 方式 2: 从 Secret 加载特定键
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-agent-api-keys
              key: OPENAI_API_KEY

        # 方式 3: 挂载 Secret 为文件
        volumeMounts:
        - name: gcp-credentials
          mountPath: /var/secrets/gcp
          readOnly: true
        - name: tls-certs
          mountPath: /etc/tls
          readOnly: true

      volumes:
      - name: gcp-credentials
        secret:
          secretName: ai-agent-gcp-credentials
      - name: tls-certs
        secret:
          secretName: ai-agent-tls

---
# ConfigMap vs Secret 使用建议：
# - 使用 Secret: 敏感信息（密码、API Key、证书）
# - 使用 ConfigMap: 非敏感配置（应用配置、环境变量）

# 创建 Secret 的命令行方法：
# kubectl create secret generic ai-agent-api-keys \
#   --from-literal=OPENAI_API_KEY=sk-xxx \
#   --from-literal=ANTHROPIC_API_KEY=sk-ant-xxx

# 从文件创建 Secret：
# kubectl create secret generic ai-agent-gcp-credentials \
#   --from-file=service-account.json=./credentials/gcp-sa.json

# 查看 Secret：
# kubectl get secrets
# kubectl describe secret ai-agent-api-keys

# 查看 Secret 内容（Base64 解码）：
# kubectl get secret ai-agent-api-keys -o jsonpath='{.data.OPENAI_API_KEY}' | base64 -d

# 删除 Secret：
# kubectl delete secret ai-agent-api-keys
