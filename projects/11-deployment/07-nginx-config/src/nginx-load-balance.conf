# Nginx 负载均衡配置
# 完整的负载均衡、限流、缓存配置

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# 事件模块
events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json escape=json '{'
        '"time": "$time_iso8601",'
        '"remote_addr": "$remote_addr",'
        '"request_method": "$request_method",'
        '"request_uri": "$request_uri",'
        '"status": $status,'
        '"body_bytes_sent": $body_bytes_sent,'
        '"request_time": $request_time,'
        '"upstream_response_time": "$upstream_response_time",'
        '"upstream_addr": "$upstream_addr",'
        '"http_user_agent": "$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;

    # 客户端配置
    client_max_body_size 20M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        text/x-component
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # 缓存配置
    proxy_cache_path /var/cache/nginx/api
        levels=1:2
        keys_zone=api_cache:10m
        max_size=1g
        inactive=60m
        use_temp_path=off;

    # ============================================
    # 上游服务器配置 - 负载均衡
    # ============================================

    # 后端 API 服务器组
    upstream api_backend {
        # 负载均衡算法: least_conn (最少连接)
        # 其他选项: ip_hash, hash, random
        least_conn;

        # 服务器列表
        # weight: 权重
        # max_fails: 最大失败次数
        # fail_timeout: 失败超时时间
        # backup: 备用服务器
        # down: 标记为下线

        server agent-api-1:8000 weight=3 max_fails=3 fail_timeout=30s;
        server agent-api-2:8000 weight=2 max_fails=3 fail_timeout=30s;
        server agent-api-3:8000 weight=1 max_fails=3 fail_timeout=30s;
        # server agent-api-4:8000 backup;  # 备用服务器

        # 保持连接
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    # WebSocket 服务器组
    upstream websocket_backend {
        ip_hash;  # 基于客户端 IP 的会话保持

        server ws-server-1:8080 weight=1;
        server ws-server-2:8080 weight=1;
    }

    # ============================================
    # 限流配置
    # ============================================

    # API 限流: 每秒 10 个请求
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # 登录限流: 每分钟 5 个请求
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # 下载限流: 每秒 2 个请求
    limit_req_zone $binary_remote_addr zone=download_limit:10m rate=2r/s;

    # 连接数限制
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # 限流日志级别
    limit_req_log_level warn;
    limit_conn_log_level warn;

    # ============================================
    # HTTP 服务器 - 重定向到 HTTPS
    # ============================================
    server {
        listen 80;
        listen [::]:80;
        server_name api.example.com;

        # ACME 挑战（Let's Encrypt）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # 其他请求重定向到 HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ============================================
    # HTTPS 服务器 - 主配置
    # ============================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.example.com;

        # SSL 证书配置
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL 安全配置（Mozilla Intermediate）
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        # SSL 会话缓存
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # 安全头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # 连接数限制
        limit_conn conn_limit 10;

        # ========================================
        # 健康检查端点 - 不限流、不记录日志
        # ========================================
        location /health {
            access_log off;
            proxy_pass http://api_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ========================================
        # API 路径 - 应用限流
        # ========================================
        location /api/ {
            # 限流: 每秒 10 个请求，允许突发 20 个
            limit_req zone=api_limit burst=20 nodelay;

            # 代理到后端
            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            # 代理头
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Keep-Alive
            proxy_set_header Connection "";

            # 超时配置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 缓冲配置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;

            # 错误处理
            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_next_upstream_tries 3;

            # 禁用缓存（API 响应通常不应缓存）
            proxy_cache off;
        }

        # ========================================
        # 登录端点 - 严格限流
        # ========================================
        location /api/auth/login {
            limit_req zone=login_limit burst=3 nodelay;

            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ========================================
        # WebSocket 支持
        # ========================================
        location /ws/ {
            proxy_pass http://websocket_backend;
            proxy_http_version 1.1;

            # WebSocket 升级头
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket 超时（保持长连接）
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ========================================
        # 静态文件 - 缓存和压缩
        # ========================================
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://api_backend;

            # 缓存配置
            expires 7d;
            add_header Cache-Control "public, immutable";

            # 启用代理缓存
            proxy_cache api_cache;
            proxy_cache_valid 200 7d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;

            # 缓存头
            add_header X-Cache-Status $upstream_cache_status;
        }

        # ========================================
        # 根路径
        # ========================================
        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ========================================
        # 错误页面
        # ========================================
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
        }

        # ========================================
        # 禁止访问隐藏文件
        # ========================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
