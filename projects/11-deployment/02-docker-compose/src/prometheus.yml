# Prometheus 监控配置

global:
  scrape_interval: 15s  # 默认抓取间隔
  evaluation_interval: 15s  # 评估规则间隔
  external_labels:
    cluster: 'ai-agent-cluster'
    environment: 'production'

# 告警管理器配置
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - 'alertmanager:9093'

# 规则文件
rule_files:
  - 'alerts/*.yml'

# 抓取配置
scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
    - targets: ['localhost:9090']

  # AI Agent API 监控
  - job_name: 'ai-agent-api'
    metrics_path: '/metrics'
    static_configs:
    - targets:
      - 'agent-api-1:8000'
      - 'agent-api-2:8000'
      - 'agent-api-3:8000'
    relabel_configs:
    - source_labels: [__address__]
      target_label: instance

  # Node Exporter (系统指标)
  - job_name: 'node-exporter'
    static_configs:
    - targets:
      - 'node-exporter:9100'

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
    - targets:
      - 'redis-exporter:9121'

  # PostgreSQL Exporter
  - job_name: 'postgresql'
    static_configs:
    - targets:
      - 'postgres-exporter:9187'

  # Nginx Exporter
  - job_name: 'nginx'
    static_configs:
    - targets:
      - 'nginx-exporter:9113'

  # Kubernetes 服务发现
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
    - role: pod
      namespaces:
        names:
        - ai-agent
    relabel_configs:
    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
      action: keep
      regex: true
    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
      action: replace
      target_label: __metrics_path__
      regex: (.+)
    - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
      action: replace
      regex: ([^:]+)(?::\d+)?;(\d+)
      replacement: $1:$2
      target_label: __address__
