# Docker Compose 配置文件
# 用于本地开发和测试环境的多容器编排

version: '3.8'

services:
  # ========================================
  # AI Agent API 服务
  # ========================================
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-api
    ports:
      - "8000:8000"  # 主机端口:容器端口
    environment:
      # 应用配置
      - ENV=production
      - LOG_LEVEL=INFO

      # 数据库连接
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/agentdb

      # Redis 连接
      - REDIS_URL=redis://redis:6379/0

      # API Keys（生产环境应使用 secrets）
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

    # 从 .env 文件加载环境变量
    env_file:
      - .env

    # 依赖服务（等待这些服务启动后再启动）
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    # 重启策略
    restart: unless-stopped

    # 网络配置
    networks:
      - agent-network

    # 卷挂载
    volumes:
      - ./logs:/app/logs  # 日志持久化
      - ./data:/app/data  # 数据持久化

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # PostgreSQL 数据库
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: agent-postgres
    environment:
      # 数据库配置
      - POSTGRES_DB=agentdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      # 数据持久化
      - postgres-data:/var/lib/postgresql/data
      # 初始化脚本
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - agent-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Redis 缓存
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: agent-redis
    command: redis-server --appendonly yes --requirepass redispassword
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - agent-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========================================
  # Nginx 反向代理
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: agent-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx 配置文件
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL 证书
      - ./ssl:/etc/nginx/ssl:ro
      # 日志
      - ./nginx-logs:/var/log/nginx
    depends_on:
      - agent-api
    restart: unless-stopped
    networks:
      - agent-network

  # ========================================
  # Prometheus 监控（可选）
  # ========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: agent-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - agent-network
    profiles:
      - monitoring  # 只在使用 --profile monitoring 时启动

  # ========================================
  # Grafana 可视化（可选）
  # ========================================
  grafana:
    image: grafana/grafana:latest
    container_name: agent-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - agent-network
    profiles:
      - monitoring

# ========================================
# 网络配置
# ========================================
networks:
  agent-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ========================================
# 数据卷配置
# ========================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
