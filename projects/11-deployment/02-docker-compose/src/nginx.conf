# Nginx 主配置文件

user nginx;
worker_processes auto;  # 自动设置为 CPU 核心数
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;  # 每个 worker 的最大连接数
    use epoll;  # Linux 下使用高效的 epoll
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # 上游服务器配置
    upstream agent_backend {
        least_conn;  # 最少连接负载均衡算法

        # 后端服务器列表
        server agent-api:8000 max_fails=3 fail_timeout=30s weight=1;
        # 如果有多个实例，可以添加：
        # server agent-api-2:8000 max_fails=3 fail_timeout=30s weight=1;
        # server agent-api-3:8000 max_fails=3 fail_timeout=30s weight=1;

        keepalive 32;  # 保持连接池
    }

    # 限流配置
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # 包含其他配置文件
    include /etc/nginx/conf.d/*.conf;
}
