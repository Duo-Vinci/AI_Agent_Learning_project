# CI/CD Pipeline - GitHub Actions
# 完整的持续集成和持续部署流程

name: CI/CD Pipeline

# 触发条件
on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'  # 版本标签触发
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 手动触发

# 环境变量
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.11'

jobs:
  # ========================================
  # 代码质量检查
  # ========================================
  lint:
    name: 代码检查
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy pylint

    - name: 运行 Black (代码格式检查)
      run: black --check --diff src/

    - name: 运行 isort (import 排序检查)
      run: isort --check-only --diff src/

    - name: 运行 Flake8 (代码规范检查)
      run: flake8 src/ --max-line-length=120 --extend-ignore=E203,W503

    - name: 运行 MyPy (类型检查)
      run: mypy src/ --ignore-missing-imports
      continue-on-error: true

  # ========================================
  # 单元测试
  # ========================================
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio pytest-mock

    - name: 运行测试
      run: |
        pytest tests/ -v \
          --cov=src \
          --cov-report=xml \
          --cov-report=html \
          --junitxml=junit.xml

    - name: 上传测试报告
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          junit.xml
          htmlcov/

    - name: 上传代码覆盖率
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.python-version }}

  # ========================================
  # 安全扫描
  # ========================================
  security:
    name: 安全扫描
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 运行 Bandit (安全漏洞扫描)
      run: |
        pip install bandit
        bandit -r src/ -f json -o bandit-report.json
      continue-on-error: true

    - name: 运行 Safety (依赖安全检查)
      run: |
        pip install safety
        safety check --json
      continue-on-error: true

    - name: 上传安全报告
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: bandit-report.json

  # ========================================
  # 构建 Docker 镜像
  # ========================================
  build:
    name: 构建镜像
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 登录到容器镜像仓库
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 提取 Docker 元数据
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: 构建并推送 Docker 镜像
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          VCS_REF=${{ github.sha }}

    - name: 扫描镜像漏洞 (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: 上传 Trivy 扫描结果
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # ========================================
  # 部署到开发环境
  # ========================================
  deploy-dev:
    name: 部署到开发环境
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: https://dev.example.com

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 部署到开发服务器
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEV_HOST }}
        username: ${{ secrets.DEV_USER }}
        key: ${{ secrets.DEV_SSH_KEY }}
        port: 22
        script: |
          cd /opt/ai-agent
          docker-compose pull
          docker-compose up -d
          docker system prune -af

    - name: 健康检查
      run: |
        sleep 10
        curl -f https://dev.example.com/health || exit 1

    - name: 通知部署结果
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: '开发环境部署完成'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # ========================================
  # 部署到生产环境
  # ========================================
  deploy-production:
    name: 部署到生产环境
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.example.com

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 配置 kubectl
      uses: azure/setup-kubectl@v3

    - name: 设置 Kubernetes 上下文
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: 部署到 Kubernetes
      run: |
        kubectl set image deployment/ai-agent \
          agent-api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -n production

        kubectl rollout status deployment/ai-agent -n production

    - name: 健康检查
      run: |
        sleep 20
        curl -f https://api.example.com/health || exit 1

    - name: 回滚 (失败时)
      if: failure()
      run: |
        kubectl rollout undo deployment/ai-agent -n production

    - name: 通知部署结果
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: '生产环境部署完成'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # ========================================
  # 性能测试
  # ========================================
  performance-test:
    name: 性能测试
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main'

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 运行 K6 负载测试
      uses: grafana/k6-action@v0.3.0
      with:
        filename: tests/performance/load-test.js
      env:
        K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}

    - name: 上传性能测试结果
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-results
        path: results/
