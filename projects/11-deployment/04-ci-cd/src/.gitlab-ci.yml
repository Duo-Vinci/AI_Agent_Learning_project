# GitLab CI/CD Pipeline
# 适用于 GitLab 平台的持续集成和部署配置

# 定义阶段
stages:
  - lint        # 代码检查
  - test        # 测试
  - security    # 安全扫描
  - build       # 构建镜像
  - deploy      # 部署

# 全局变量
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  PYTHON_VERSION: "3.11"

# 默认配置
default:
  image: python:${PYTHON_VERSION}
  cache:
    paths:
      - .pip-cache/
  before_script:
    - pip install --cache-dir .pip-cache --upgrade pip

# ============================================================
# 代码质量检查
# ============================================================
lint:black:
  stage: lint
  script:
    - pip install black
    - black --check --diff src/
  allow_failure: false

lint:flake8:
  stage: lint
  script:
    - pip install flake8
    - flake8 src/ --max-line-length=120 --extend-ignore=E203,W503
  allow_failure: false

lint:mypy:
  stage: lint
  script:
    - pip install mypy
    - mypy src/ --ignore-missing-imports
  allow_failure: true

# ============================================================
# 单元测试
# ============================================================
test:unit:
  stage: test
  script:
    - pip install -r requirements.txt
    - pip install pytest pytest-cov pytest-asyncio
    - pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
    expire_in: 1 week

# 多 Python 版本测试
.test-template: &test-template
  stage: test
  script:
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
    - pytest tests/ -v

test:python3.10:
  <<: *test-template
  image: python:3.10

test:python3.11:
  <<: *test-template
  image: python:3.11

test:python3.12:
  <<: *test-template
  image: python:3.12

# ============================================================
# 安全扫描
# ============================================================
security:bandit:
  stage: security
  script:
    - pip install bandit
    - bandit -r src/ -f json -o bandit-report.json
  artifacts:
    paths:
      - bandit-report.json
    expire_in: 1 week
  allow_failure: true

security:safety:
  stage: security
  script:
    - pip install safety
    - safety check --json
  allow_failure: true

security:secrets-scan:
  stage: security
  image: trufflesecurity/trufflehog:latest
  script:
    - trufflehog filesystem . --json > trufflehog-report.json
  artifacts:
    paths:
      - trufflehog-report.json
    expire_in: 1 week
  allow_failure: true

# ============================================================
# Docker 镜像构建
# ============================================================
build:docker:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # 构建镜像
    - |
      docker build \
        --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
        --build-arg VCS_REF=$CI_COMMIT_SHORT_SHA \
        --build-arg VERSION=$CI_COMMIT_REF_NAME \
        -t $IMAGE_TAG \
        -t $CI_REGISTRY_IMAGE:latest \
        .

    # 推送镜像
    - docker push $IMAGE_TAG
    - |
      if [ "$CI_COMMIT_BRANCH" == "main" ]; then
        docker push $CI_REGISTRY_IMAGE:latest
      fi

    # 清理
    - docker system prune -af

  only:
    - main
    - develop
    - tags

# 镜像安全扫描
build:scan:
  stage: build
  image: aquasec/trivy:latest
  needs: ["build:docker"]
  script:
    - trivy image --severity HIGH,CRITICAL $IMAGE_TAG
  allow_failure: true
  only:
    - main
    - develop

# ============================================================
# 部署到开发环境
# ============================================================
deploy:dev:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client curl
    - eval $(ssh-agent -s)
    - echo "$DEV_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $DEV_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh $DEV_USER@$DEV_HOST "
        cd /opt/ai-agent &&
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $IMAGE_TAG &&
        docker-compose up -d &&
        docker system prune -af
      "

    # 健康检查
    - sleep 10
    - curl -f https://dev.example.com/health || exit 1

  environment:
    name: development
    url: https://dev.example.com

  only:
    - develop

  when: manual  # 手动触发

# ============================================================
# 部署到生产环境
# ============================================================
deploy:production:
  stage: deploy
  image: bitnami/kubectl:latest
  before_script:
    - echo "$KUBE_CONFIG" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    # 更新 Kubernetes Deployment
    - |
      kubectl set image deployment/ai-agent \
        agent-api=$IMAGE_TAG \
        -n production

    # 等待部署完成
    - kubectl rollout status deployment/ai-agent -n production --timeout=5m

    # 健康检查
    - sleep 20
    - kubectl exec -n production deployment/ai-agent -- curl -f http://localhost:8000/health

  environment:
    name: production
    url: https://api.example.com
    on_stop: stop:production

  only:
    - main

  when: manual  # 生产部署需要手动确认

# 生产环境回滚
stop:production:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "$KUBE_CONFIG" | base64 -d > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
    - kubectl rollout undo deployment/ai-agent -n production
  environment:
    name: production
    action: stop
  when: manual
  only:
    - main

# ============================================================
# 性能测试
# ============================================================
test:performance:
  stage: deploy
  image: grafana/k6:latest
  needs: ["deploy:production"]
  script:
    - k6 run tests/performance/load-test.js
  artifacts:
    paths:
      - results/
    expire_in: 1 week
  only:
    - main
  when: manual

# ============================================================
# 清理旧镜像
# ============================================================
cleanup:
  stage: deploy
  image: alpine:latest
  script:
    - echo "清理旧的 Docker 镜像和构建缓存"
  only:
    - schedules
  when: manual
