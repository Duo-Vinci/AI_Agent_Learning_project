# Logstash 配置文件

# 输入插件配置
input {
  # 从 Filebeat 接收日志
  beats {
    port => 5044
    codec => json
  }

  # 直接读取文件（备选方案）
  file {
    path => "/var/log/agent/*.log"
    start_position => "beginning"
    codec => json
  }
}

# 过滤器插件 - 日志处理和增强
filter {
  # 解析 JSON 日志
  if [message] =~ /^{.*}$/ {
    json {
      source => "message"
      target => "parsed"
    }

    # 将解析后的字段提升到根级别
    mutate {
      rename => {
        "[parsed][timestamp]" => "timestamp"
        "[parsed][level]" => "level"
        "[parsed][logger]" => "logger"
        "[parsed][message]" => "log_message"
        "[parsed][agent_id]" => "agent_id"
        "[parsed][task_id]" => "task_id"
        "[parsed][user_id]" => "user_id"
        "[parsed][duration]" => "duration"
      }
      remove_field => ["parsed", "message"]
    }
  }

  # 添加服务标签
  mutate {
    add_field => {
      "service" => "ai-agent"
      "environment" => "production"
    }
  }

  # 解析时间戳
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }

  # 日志级别标签
  if [level] == "ERROR" or [level] == "CRITICAL" {
    mutate {
      add_tag => [ "error" ]
    }
  }

  if [level] == "WARNING" {
    mutate {
      add_tag => [ "warning" ]
    }
  }

  # LLM 调用日志特殊处理
  if [llm_call] {
    mutate {
      add_field => {
        "llm_model" => "%{[llm_call][model]}"
        "llm_total_tokens" => "%{[llm_call][total_tokens]}"
        "llm_cost" => "%{[llm_call][cost]}"
      }
      add_tag => [ "llm_call" ]
    }

    # 转换数值类型
    mutate {
      convert => {
        "llm_total_tokens" => "integer"
        "llm_cost" => "float"
      }
    }
  }

  # 工具调用日志
  if [extra] and [extra][tool_name] {
    mutate {
      add_field => {
        "tool_name" => "%{[extra][tool_name]}"
      }
      add_tag => [ "tool_call" ]
    }
  }

  # 异常日志处理
  if [exception] {
    mutate {
      add_field => {
        "exception_type" => "%{[exception][type]}"
        "exception_message" => "%{[exception][message]}"
      }
      add_tag => [ "exception" ]
    }
  }

  # 按 Agent ID 分类
  if [agent_id] {
    mutate {
      add_field => { "agent_type" => "worker" }
    }
  }

  # 性能慢查询标记
  if [duration] {
    mutate {
      convert => { "duration" => "float" }
    }

    if [duration] > 10 {
      mutate {
        add_tag => [ "slow_query" ]
      }
    }
  }

  # 删除不需要的字段
  mutate {
    remove_field => [ "host", "agent", "ecs", "input" ]
  }
}

# 输出插件配置
output {
  # 所有日志输出到 Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "agent-logs-%{+YYYY.MM.dd}"

    # 文档 ID 模板
    document_id => "%{[@metadata][fingerprint]}"
  }

  # 错误日志单独索引
  if "error" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "agent-errors-%{+YYYY.MM.dd}"
    }
  }

  # LLM 调用日志单独索引（用于成本分析）
  if "llm_call" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "agent-llm-calls-%{+YYYY.MM.dd}"
    }
  }

  # 慢查询日志单独索引
  if "slow_query" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "agent-slow-queries-%{+YYYY.MM.dd}"
    }
  }

  # 调试输出（开发环境）
  # stdout {
  #   codec => rubydebug
  # }
}
