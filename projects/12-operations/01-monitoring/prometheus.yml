"""
Prometheus 配置示例
用于监控 AI Agent 应用
"""

# Prometheus 全局配置
global:
  # 数据抓取间隔
  scrape_interval: 15s

  # 评估告警规则间隔
  evaluation_interval: 15s

  # 外部标签（用于联邦或远程存储）
  external_labels:
    cluster: 'ai-agent-cluster'
    environment: 'production'

# 告警管理器配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# 告警规则文件
rule_files:
  - '/etc/prometheus/alerts.yml'

# 数据抓取配置
scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # AI Agent 应用指标
  - job_name: 'ai-agent-api'
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'localhost:8001'  # metrics.py 暴露的端点
        labels:
          service: 'agent-api'
          team: 'ai-team'

    # 指标路径
    metrics_path: '/metrics'

    # 基本认证（可选）
    # basic_auth:
    #   username: 'prometheus'
    #   password: 'your_password'

  # Node Exporter - 系统级指标
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          service: 'node'

  # PostgreSQL 数据库监控
  - job_name: 'postgres'
    static_configs:
      - targets: ['localhost:9187']
        labels:
          service: 'postgres'
          database: 'agentdb'

  # Redis 监控
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:9121']
        labels:
          service: 'redis'

  # Kubernetes Pod 自动发现（如果使用 K8s）
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod

    relabel_configs:
      # 只抓取带有 prometheus.io/scrape: "true" 注解的 Pod
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true

      # 使用注解中的端口
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: ([^:]+)(?::\d+)?
        replacement: $1:$2

      # 使用注解中的路径
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)

  # Docker 容器监控
  - job_name: 'docker-containers'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'

# 远程写入配置（可选 - 用于长期存储）
